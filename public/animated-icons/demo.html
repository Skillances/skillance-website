<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skillance animated icons</title>
<link rel="stylesheet" href="skillance-icons.css">
<style>
body{margin:0;padding:24px 16px;font:16px system-ui,sans-serif;background:#fff;color:#141414}
h1{font-size:20px;margin:0 0 4px} p{margin:0 0 20px;color:#737373}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:16px;max-width:720px}
figure{margin:0;text-align:center} figcaption{margin-top:6px;font-size:13px;text-transform:capitalize;color:#525252}
.sk-icon{width:80px;height:80px}
</style></head><body>
<h1>Skillance animated icons</h1><p>Click or press Enter on an icon.</p>
<div class="grid">
    <figure><span data-sk-icon="handyman"></span><figcaption>handyman</figcaption></figure>
    <figure><span data-sk-icon="education"></span><figcaption>education</figcaption></figure>
    <figure><span data-sk-icon="cleaning"></span><figcaption>cleaning</figcaption></figure>
    <figure><span data-sk-icon="pet_care"></span><figcaption>pet care</figcaption></figure>
    <figure><span data-sk-icon="fitness"></span><figcaption>fitness</figcaption></figure>
    <figure><span data-sk-icon="automotive"></span><figcaption>automotive</figcaption></figure>
    <figure><span data-sk-icon="gardening"></span><figcaption>gardening</figcaption></figure>
    <figure><span data-sk-icon="technology"></span><figcaption>technology</figcaption></figure>
    <figure><span data-sk-icon="photography"></span><figcaption>photography</figcaption></figure>
    <figure><span data-sk-icon="personal_services"></span><figcaption>personal services</figcaption></figure>
    <figure><span data-sk-icon="professional_services"></span><figcaption>professional services</figcaption></figure>
    <figure><span data-sk-icon="influencing"></span><figcaption>influencing</figcaption></figure>
    <figure><span data-sk-icon="videography"></span><figcaption>videography</figcaption></figure>
    <figure><span data-sk-icon="music"></span><figcaption>music</figcaption></figure>
</div>
<script src="skillance-icons.js"></script>
</body></html>
