# Serves the built Vite SPA (dist/) on port 8080 inside Azure App Service.
# Azure terminates TLS and enforces HTTPS (httpsOnly), so nginx only speaks plain HTTP.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Azure sits in front on 443; never put the internal port in redirects.
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/markdown application/json application/xml;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/markdown application/json application/javascript
               application/xml image/svg+xml application/manifest+json;

    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    # Never serve dotfiles, except /.well-known.
    location ~ /\.(?!well-known) {
        return 404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = /home {
        return 301 /;
    }

    # Client error reports: the Node sidecar enforces origin, size, content type and rate limits.
    location = /api/client-log {
        limit_except POST {
            deny all;
        }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        return 404;
    }

    # Home and /beyond: serve markdown to agents that ask for it, HTML for everyone else.
    location ~ ^/(index\.html|beyond/?)?$ {
        if ($http_accept ~* "text/markdown") {
            return 418;
        }
        error_page 418 = @markdown;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        add_header Link "</.well-known/api-catalog>; rel=\"api-catalog\", <https://api.skillance.co.za/docs>; rel=\"service-doc\"" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location @markdown {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept $http_accept;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Target of the sidecar's X-Accel-Redirect when the Accept header does not prefer markdown.
    location = /__html {
        internal;
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        add_header Link "</.well-known/api-catalog>; rel=\"api-catalog\", <https://api.skillance.co.za/docs>; rel=\"service-doc\"" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed build output never changes.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /app-icon.png {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /.well-known/api-catalog {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ ^/(sitemap\.xml|robots\.txt|llms\.txt|llms-full\.txt)$ {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ \.md$ {
        default_type text/markdown;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Everything else: real file, otherwise the SPA shell (client-side routing).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
