name: Deploy website to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-skillance-prod
  WEBAPP_NAME: app-skillance-web-53be9f
  ACR_NAME: skillanceacr53be9f
  ACR_LOGIN_SERVER: skillanceacr53be9f.azurecr.io
  ACR_REPOSITORY: skillance-web
  SITE_URL: https://skillance.co.za

concurrency:
  group: azure-app-service
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: |
          TOKEN=$(az acr login --name "${ACR_NAME}" --expose-token --query accessToken -o tsv)
          echo "$TOKEN" | docker login "${ACR_LOGIN_SERVER}" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.ACR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.ACR_REPOSITORY }}:latest
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.skillance.co.za' }}
            VITE_AUTH_REFRESH_COOKIE=${{ vars.VITE_AUTH_REFRESH_COOKIE }}
            VITE_PUBLIC_S3_CATEGORY_BASE=${{ vars.VITE_PUBLIC_S3_CATEGORY_BASE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Point the web app at this image
        run: |
          az webapp config container set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${WEBAPP_NAME}" \
            --container-image-name "${ACR_LOGIN_SERVER}/${ACR_REPOSITORY}:${GITHUB_SHA}"
          az webapp restart --resource-group "${AZURE_RESOURCE_GROUP}" --name "${WEBAPP_NAME}"

      - name: Wait for health check
        run: |
          URL="https://${WEBAPP_NAME}.azurewebsites.net/healthz"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then
              echo "Healthy after ${i} checks."
              exit 0
            fi
            sleep 10
          done
          echo "Web app did not become healthy."
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Notify IndexNow
        run: INDEXNOW_FORCE=1 node scripts/ping-indexnow.mjs
        continue-on-error: true
